name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Isse aap GitHub website se button click karke bhi EXE bana sakenge

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name="DLL_Bug_Doctor" dll_bug_doctor.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-DLL-Bug-Doctor-EXE
        path: dist/DLL_Bug_Doctor.exe
